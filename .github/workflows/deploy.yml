name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # .docs-kit (docs-kit, public)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .docs-kit/site/package-lock.json
      # docs-kit builds the site from docs/ and docs-kit.yml; host runner = Node on the runner (no Docker image needed).
      # --strict: any docs-kit WARNING (broken link, page not in the menu, ...) fails the deploy.
      - run: .docs-kit/bin/docs.sh build --strict
        env:
          DOCS_RUNNER: host
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
