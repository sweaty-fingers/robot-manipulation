# docs-kit 프로젝트 설정: 켤 탭(메뉴), 분야 목록, 사이트 설정입니다. 프로젝트 설정 파일은 이것 하나입니다.
#   보기:   .docs-kit/bin/kit.py status
#   바꾸기: .docs-kit/bin/kit.py enable <id> | disable <id> | profile <묶음>   (켤 때 시작 파일을 복사)
profile: minimal                 # minimal | app | dev | research | all
features:                        # 묶음에서 바꿀 탭만
  adr: false                     # ADR 탭 모듈은 docs-kit Astro 판 M4에서 만들어짐. 첫 ADR을 쓸 때 켬
  background: true               # 개념·도구 설명 (배경 NN)
  reference: true                # 자료 모음 (참고 R<N>)
areas:                           # ADR·VR·EXP 머리말 area 값 (id: 이름)
  sim: 시뮬레이션
  control: 제어·파지
  learning: 학습
  data: 데이터
  docs: 문서

site:
  name: "Robot Manipulation Lab"
  logo_icon: robot
  issues_url: https://github.com/sweaty-fingers/robot-manipulation/issues/
  base: /robot-manipulation/     # GitHub Pages 프로젝트 사이트 경로
  url: https://sweaty-fingers.github.io
  extra_css: [_static/site.css]  # 그림(인라인 SVG) 스타일

links:                           # 짧은 주소 /r/<name>/
  - {name: home, to: README.md, title: 첫 페이지}
